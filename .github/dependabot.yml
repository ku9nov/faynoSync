version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /dashboard
    target-branch: development
    schedule:
      interval: weekly
    groups:
      dashboard-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /
      - /docker-compose/images/garage
    target-branch: development
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
