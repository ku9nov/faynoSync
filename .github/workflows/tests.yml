name: Tests

on:
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Go unit tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Run unit tests
        run: |
          go test ./server/... -race
        continue-on-error: false

      - name: Validate production compose file
        run: |
          printf 'FAYNOSYNC_VERSION=latest\nMONGO_ROOT_PASSWORD=ci\nREDIS_PASSWORD=ci\n' > deploy/.env
          docker compose -f deploy/docker-compose.yaml config -q

  integration-tests:
    name: Docker Compose integration tests (${{ matrix.mongo }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        mongo: ['mongo:7.0', 'mongo:8.0']
    env:
      MONGO_IMAGE: ${{ matrix.mongo }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Start Services
        run: docker compose up --build -d

      - name: Run migrations
        run: docker compose exec -T backend /usr/bin/faynoSync migrate up
        continue-on-error: false

      - name: Run Tests
        run: docker compose exec -T backend "/usr/bin/faynoSync_tests"
        continue-on-error: false

      - name: Stop Services
        if: always()
        run: docker compose down
