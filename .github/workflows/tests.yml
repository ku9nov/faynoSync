name: Tests

on:
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...


  unit-tests:
    name: Go unit tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: |
          go test ./server/... -race
        continue-on-error: false

      - name: Validate production compose file
        run: |
          printf 'FAYNOSYNC_VERSION=latest\nMONGO_ROOT_PASSWORD=ci\nREDIS_PASSWORD=ci\n' > deploy/.env
          docker compose -f deploy/docker-compose.yaml config -q

  dashboard:
    name: Dashboard lint and build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: dashboard/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

  integration-tests:
    name: Docker Compose integration tests (${{ matrix.mongo }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        mongo: ['mongo:7.0', 'mongo:8.0']
    env:
      MONGO_IMAGE: ${{ matrix.mongo }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Start Services
        run: docker compose up --build -d

      - name: Run migrations
        run: docker compose exec -T backend /usr/bin/faynoSync migrate up
        continue-on-error: false

      - name: Run Tests
        run: docker compose exec -T backend "/usr/bin/faynoSync_tests"
        continue-on-error: false

      - name: Stop Services
        if: always()
        run: docker compose down
