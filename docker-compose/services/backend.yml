services:
  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: dev
    container_name: "faynoSync_backend"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      s3:
        condition: service_healthy
    networks:
      - faynosync_network
    ports:
      - "9000:9000"
    env_file:
      - ../../.env.example
    # .env.example targets the API running on the host; inside the network the services have their own names
    environment:
      MONGODB_URL: mongodb://root:MheCk6sSKB1m4xKNw5I@db/cb_faynosync_db?authSource=admin
      MONGODB_URL_TESTS: mongodb://root:MheCk6sSKB1m4xKNw5I@db/cb_faynosync_db_tests?authSource=admin
      REDIS_HOST: cache
      S3_API_ENDPOINT: http://s3:3900
      ONLINE_KEY_DIR: /app/tuf_keys/private_keys
    volumes:
      - ../../tuf_keys/:/app/tuf_keys/
