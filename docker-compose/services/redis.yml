services:
  cache:
    image: redis:8.8
    container_name: "faynoSync_redis"
    networks:
      - faynosync_network
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --save 20 1 --loglevel warning
    volumes: 
      - cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
